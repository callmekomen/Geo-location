name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify the bundled map data
        run: npm run verify

      - name: Tests
        run: npm test

      - name: Boot check — the app must work with no network and no keys
        env:
          UPSTREAM_ENABLED: "0"
          PORT: "3111"
        run: |
          node server/index.js &
          pid=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3111/api/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:3111/api/health
          curl -sf -X POST http://127.0.0.1:3111/api/route \
            -H 'content-type: application/json' \
            -d '{"from":"Ikeja","to":"Benin City"}' | head -c 200
          kill $pid

  docker:
    runs-on: ubuntu-latest
    name: Docker image
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t naija-routes:ci .
      - name: Run and probe
        run: |
          docker run -d --name nr -p 3000:3000 naija-routes:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/api/meta >/dev/null
          docker rm -f nr
