<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<meta name="description" content="Follow a journey live on Naija Routes — position, progress, expected arrival and road conditions ahead.">
<title>Following a trip — Naija Routes</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .track-shell { display: flex; flex-direction: column; height: 100%; }
  .track-main { flex: 1; display: flex; min-height: 0; }
  .track-side {
    width: 380px; min-width: 380px; background: var(--ink-2); border-right: 1px solid var(--line-soft);
    overflow-y: auto; padding: 18px 18px 40px;
  }
  .hero { text-align: center; padding: 6px 0 14px; }
  .hero .who { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; font-size: 21px; }
  .hero .leg { font-size: 13px; color: var(--text-dim); margin-top: 5px; line-height: 1.5; }
  .countdown { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-top: 12px; }
  .countdown.late { color: var(--alert); }
  .countdown small { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-top: 4px; font-family: var(--sans); }
  .sos-banner {
    background: var(--alert); color: #fff; padding: 12px 14px; border-radius: var(--radius);
    font-weight: 600; font-size: 13.5px; margin-bottom: 14px; line-height: 1.5;
  }
  @media (max-width: 760px) {
    .track-main { flex-direction: column; }
    .track-side { width: 100%; min-width: 0; max-height: 52vh; border-right: none; border-top: 1px solid var(--line); order: 2; }
    #trackMap { order: 1; min-height: 45vh; }
  }
</style>
</head>
<body>
<div class="track-shell">
  <header class="topbar">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#ffc328"/>
        <path d="M9 25c2.2-7.5 5-13 7-17" stroke="#131417" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M23 25c-1.1-7.5-2.6-13-4.2-17" stroke="#131417" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text"><strong>Naija Routes</strong><span>Live trip</span></span>
    </a>
    <div class="topbar-spacer"></div>
    <span class="chip"><span class="dot live"></span><span id="refreshedAt">loading…</span></span>
    <a class="chip" href="/" style="text-decoration:none">Open the map</a>
  </header>

  <div class="track-main">
    <aside class="track-side" id="side">
      <div class="skeleton" style="height:160px"></div>
    </aside>
    <div id="trackMap" style="flex:1; min-width:0;"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/track.js"></script>
</body>
</html>
